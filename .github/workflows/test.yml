name: Test DigiVerify wallet policy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile bot.py pool.py mirror.py panel.py
      - name: Check dashboard browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('admin.html').read_text(encoding='utf-8')
          js = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('dashboard-check.js').write_text(js, encoding='utf-8')
          PY
          node --check dashboard-check.js
      - run: python -m unittest discover -s tests -v
